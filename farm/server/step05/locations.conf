location ^~ /step05/api/device/v1/ {
    limit_req zone=popfarm_agent burst=8 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    access_log /var/log/nginx/poptracker-step05.log popfarm;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/poptracker-step05/index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php/poptracker-step05.sock;

    location = /step05/api/device/v1/enroll {
        limit_req zone=popfarm_enroll burst=3 nodelay;
        fastcgi_pass unix:/run/php/poptracker-step05.sock;
    }
}
