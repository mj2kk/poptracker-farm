[poptracker-step05]
user = popfarmstep5
group = popfarmstep5
listen = /run/php/poptracker-step05.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 15s
env[FARM_DSN] = "mysql:unix_socket=/run/mysqld/mysqld.sock;dbname=poptracker_farm_test_step05;charset=utf8mb4"
env[FARM_DB_USER] = popfarmstep5
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
