location ^~ /api/device/v1/ {
    limit_req zone=popfarm_agent burst=15 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    error_page 413 = @popfarm_body_too_large;
    location ~ ^/api/device/v1/tasks/[0-9a-f-]+/result$ {
        client_max_body_size 128k;
        fastcgi_pass unix:/run/php/poptracker-farm.sock;
    }
    access_log /var/log/nginx/poptracker-farm.log popfarm;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME "/PopTracker Farm/server/public/index.php";
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php/poptracker-farm.sock;

    location = /api/device/v1/enroll {
        limit_req zone=popfarm_enroll burst=4 nodelay;
        fastcgi_pass unix:/run/php/poptracker-farm.sock;
    }
}

location @popfarm_body_too_large {
    default_type application/json;
    return 413 '{"error":"body_too_large"}';
}
