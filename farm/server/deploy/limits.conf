limit_req_zone $binary_remote_addr zone=popfarm_enroll:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=popfarm_agent:1m rate=5r/s;
map $uri $popfarm_route {
    default other;
    /api/device/v1/tasks/claim claim;
    ~^/api/device/v1/tasks/[a-f0-9-]+/result$ result;
    /api/device/v1/enroll enroll;
    /api/device/v1/me me;
    /api/device/v1/heartbeat heartbeat;
}
log_format popfarm '$time_iso8601 $request_method $popfarm_route $status';
